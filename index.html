<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veritas Vault OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-glass: rgba(240, 243, 248, 0.45);
            --card-glass: rgba(255, 255, 255, 0.72);
            --pill-glass: rgba(255, 255, 255, 0.88);
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-soft: rgba(255, 255, 255, 0.7);
            --shadow-subtle: 0 20px 50px rgba(15, 23, 42, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, rgba(200, 210, 225, 0.35), rgba(150, 165, 185, 0.5)),
                        url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=2400&q=85') center/cover fixed no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--text-dark);
            overflow: hidden;
        }

        .viewport-shell {
            width: 100%;
            max-width: 1280px;
            height: 90vh;
            max-height: 850px;
            background: var(--bg-glass);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 2px solid var(--border-soft);
            border-radius: 44px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.22);
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .dock-bar {
            width: 72px;
            background: rgba(255, 255, 255, 0.4);
            border-right: 1.5px solid var(--border-soft);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px 0;
            z-index: 10;
        }

        .dock-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .dock-btn {
            width: 44px;
            height: 44px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-muted);
        }

        .dock-btn:hover, .dock-btn.active {
            background: #ffffff;
            color: var(--text-dark);
            transform: scale(1.08);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
        }

        .main-canvas {
            flex: 1;
            padding: 32px 40px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .main-canvas::-webkit-scrollbar { display: none; }

        .floating-top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .brand-tag {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.95);
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .status-pill {
            background: var(--pill-glass);
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
            border: 1px solid #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
        }

        .hero-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 40px;
            animation: fadeIn 0.6s ease-out;
        }

        .hero-title {
            font-size: clamp(48px, 6vw, 76px);
            font-weight: 800;
            color: #ffffff;
            line-height: 1.05;
            margin-bottom: 18px;
            letter-spacing: -1.5px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }

        .hero-desc {
            font-size: 17px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 36px;
            font-weight: 400;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            max-width: 620px;
        }

        .action-explore-btn {
            background: #ffffff;
            color: var(--text-dark);
            padding: 18px 40px;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .action-explore-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        }

        .archive-view {
            display: none;
            flex-direction: column;
            gap: 28px;
            animation: fadeIn 0.5s ease-out;
        }

        .filter-ribbon {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.45);
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid var(--border-soft);
            width: fit-content;
            overflow-x: auto;
        }

        .target-pill {
            padding: 10px 24px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            background: transparent;
            border: none;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .target-pill.active {
            background: #ffffff;
            color: var(--text-dark);
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        }

        .bento-feed {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .bento-card {
            background: var(--card-glass);
            border: 1.5px solid var(--border-soft);
            border-radius: 30px;
            padding: 16px;
            box-shadow: var(--shadow-subtle);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .media-frame {
            width: 100%;
            height: 220px;
            border-radius: 22px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.05);
        }

        .media-frame img, .media-frame video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
        }

        .profile-badge {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dark);
            background: rgba(255, 255, 255, 0.85);
            padding: 6px 14px;
            border-radius: 999px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(14px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-body {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 36px;
            width: 100%;
            max-width: 460px;
            padding: 36px;
            border: 2px solid #ffffff;
            box-shadow: 0 30px 70px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        .input-stylish {
            width: 100%;
            padding: 14px 18px;
            border-radius: 16px;
            border: 1.5px solid #e2e8f0;
            background: #f8fafc;
            font-size: 14px;
            outline: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="viewport-shell">
    <div class="dock-bar">
        <div class="dock-group">
            <div class="dock-btn active" title="Dossier" onclick="switchView('explore')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
            </div>
            <div class="dock-btn" title="Home" onclick="switchView('hero')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            </div>
        </div>

        <div class="dock-group">
            <div class="dock-btn" title="Admin Security Hub" onclick="openAdmin()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </div>
        </div>
    </div>

    <div class="main-canvas">
        <div class="floating-top-nav">
            <span class="brand-tag">SECURE REPOSITORY</span>
            <div class="status-pill">
                <div class="status-dot"></div>
                <span id="nav-status-label">Ready</span>
            </div>
        </div>

        <div class="hero-view" id="hero-view">
            <div class="hero-content">
                <h1 class="hero-title">Veritas Archive.</h1>
                <p class="hero-desc">Independent documentation log. High-fidelity timeline of digital interactions and chronological media records.</p>
                <button class="action-explore-btn" onclick="switchView('explore')">Explore Directory</button>
            </div>
        </div>

        <div class="archive-view" id="archive-view">
            <div class="filter-ribbon" id="names-ribbon">
                <button class="target-pill active" onclick="filterBy('all', this)">All Records</button>
            </div>
            <div class="bento-feed" id="media-feed"></div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="admin-modal">
    <div class="modal-body">
        <button onclick="closeAdmin()" style="position:absolute; top:24px; right:24px; border:none; background:none; font-size:20px; cursor:pointer;">&times;</button>
        
        <div id="admin-login-box">
            <h3>Admin Sign In</h3>
            <p style="font-size:13px; color:var(--text-muted); margin-bottom:16px;">Sign in via your Google account.</p>
            <button class="action-explore-btn" style="width:100%; justify-content:center;" onclick="executeGoogleLogin()">Sign in with Google</button>
        </div>

        <div id="admin-tools-box" style="display:none; flex-direction:column; gap:18px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>Directory Manager</h3>
                <button onclick="executeLogout()" style="background:none; border:none; color:#ef4444; font-weight:700; cursor:pointer;">Exit</button>
            </div>

            <div>
                <span style="font-size:12px; font-weight:700; color:var(--text-muted);">REGISTER INDIVIDUAL</span>
                <div style="display:flex; gap:10px; margin-top:8px;">
                    <input type="text" id="target-name-input" class="input-stylish" placeholder="Name (e.g. Durgesh)">
                    <button class="action-explore-btn" style="padding:12px 24px;" onclick="addProfile()">Save</button>
                </div>
            </div>

            <hr style="border:none; border-top:1px solid #e2e8f0;">

            <div>
                <span style="font-size:12px; font-weight:700; color:var(--text-muted);">UPLOAD TO CLOUDINARY</span>
                <select id="profile-select" class="input-stylish" style="margin-top:8px;">
                    <option value="">Choose Profile</option>
                </select>
                <input type="file" id="media-file-input" class="input-stylish" style="margin-top:10px;">
                <button class="action-explore-btn" style="width:100%; justify-content:center; margin-top:14px;" onclick="uploadToCloudinary()">Upload Record</button>
                <p id="upload-feedback" style="font-size:12px; text-align:center; font-weight:600; margin-top:8px;"></p>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. Firebase Config (Pre-configured)
    const firebaseConfig = {
        apiKey: "AIzaSyCJkf4BFI2Dnxy6s0zHVL1V_O0UKLNTyFA",
        authDomain: "vault-app-31cac.firebaseapp.com",
        databaseURL: "https://vault-app-31cac-default-rtdb.firebaseio.com",
        projectId: "vault-app-31cac",
        storageBucket: "vault-app-31cac.firebasestorage.app",
        messagingSenderId: "1017794169031",
        appId: "1:1017794169031:web:574d2e2701ed188a6596e2",
        measurementId: "G-452430JDS2"
    };

    // 2. Cloudinary Credentials (Pre-configured)
    const CLOUDINARY_CLOUD_NAME = "f1rdlzvm";
    const CLOUDINARY_PRESET = "vault_preset";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let masterRecords = [];

    window.switchView = (view) => {
        if(view === 'explore') {
            document.getElementById('hero-view').style.display = 'none';
            document.getElementById('archive-view').style.display = 'flex';
            loadArchiveFeed();
        } else {
            document.getElementById('archive-view').style.display = 'none';
            document.getElementById('hero-view').style.display = 'flex';
        }
    };

    window.openAdmin = () => document.getElementById('admin-modal').style.display = 'flex';
    window.closeAdmin = () => document.getElementById('admin-modal').style.display = 'none';

    onAuthStateChanged(auth, (user) => {
        if(user) {
            document.getElementById('admin-login-box').style.display = 'none';
            document.getElementById('admin-tools-box').style.display = 'flex';
            refreshAdminDropdown();
        } else {
            document.getElementById('admin-login-box').style.display = 'block';
            document.getElementById('admin-tools-box').style.display = 'none';
        }
    });

    window.executeGoogleLogin = async () => {
        try {
            await signInWithPopup(auth, provider);
        } catch(err) { alert(err.message); }
    };

    window.executeLogout = () => signOut(auth);

    window.addProfile = async () => {
        const input = document.getElementById('target-name-input');
        const name = input.value.trim();
        if(!name) return;

        try {
            await addDoc(collection(db, "targets"), { name });
            input.value = "";
            refreshAdminDropdown();
            loadRibbonTabs();
            alert("Added " + name);
        } catch(e) { alert(e.message); }
    };

    async function refreshAdminDropdown() {
        const select = document.getElementById('profile-select');
        select.innerHTML = '<option value="">Choose Profile</option>';
        const snap = await getDocs(collection(db, "targets"));
        snap.forEach(doc => {
            const opt = document.createElement('option');
            opt.value = doc.data().name;
            opt.textContent = doc.data().name;
            select.appendChild(opt);
        });
    }

    // Direct Upload to Cloudinary & Metadata in Firestore
    window.uploadToCloudinary = async () => {
        const person = document.getElementById('profile-select').value;
        const fileIn = document.getElementById('media-file-input');
        const feedback = document.getElementById('upload-feedback');

        if(!person || fileIn.files.length === 0) {
            alert("Profile aur file choose kar pehle!");
            return;
        }

        const file = fileIn.files[0];
        const isVideo = file.type.includes('video');
        const endpoint = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${isVideo ? 'video' : 'image'}/upload`;

        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", CLOUDINARY_PRESET);

        feedback.innerText = "Uploading securely to Cloudinary...";

        try {
            const res = await fetch(endpoint, { method: "POST", body: formData });
            const data = await res.json();

            if (!res.ok) throw new Error(data.error?.message || "Upload failed");

            await addDoc(collection(db, "media"), {
                targetName: person,
                url: data.secure_url,
                type: file.type,
                createdAt: new Date()
            });

            feedback.innerText = "Record successfully saved!";
            fileIn.value = "";
            loadArchiveFeed();
        } catch(e) {
            feedback.innerText = "Error: " + e.message;
        }
    };

    async function loadRibbonTabs() {
        const ribbon = document.getElementById('names-ribbon');
        ribbon.innerHTML = '<button class="target-pill active" onclick="filterBy(\'all\', this)">All Records</button>';
        const snap = await getDocs(collection(db, "targets"));
        snap.forEach(doc => {
            const btn = document.createElement('button');
            btn.className = 'target-pill';
            btn.innerText = doc.data().name;
            btn.onclick = () => filterBy(doc.data().name, btn);
            ribbon.appendChild(btn);
        });
    }

    async function loadArchiveFeed() {
        await loadRibbonTabs();
        const feed = document.getElementById('media-feed');
        feed.innerHTML = '<p style="color:var(--text-muted); font-size:14px;">Retrieving files...</p>';

        try {
            const q = query(collection(db, "media"), orderBy("createdAt", "desc"));
            const snap = await getDocs(q);
            masterRecords = [];
            snap.forEach(doc => masterRecords.push(doc.data()));
            renderCards(masterRecords);
        } catch(e) {
            feed.innerHTML = '<p style="color:var(--text-muted);">No records registered.</p>';
        }
    }

    function renderCards(records) {
        const feed = document.getElementById('media-feed');
        feed.innerHTML = "";
        if(records.length === 0) {
            feed.innerHTML = '<p style="color:var(--text-muted); font-size:14px;">No files uploaded yet.</p>';
            return;
        }

        records.forEach(item => {
            const card = document.createElement('div');
            card.className = 'bento-card';
            const mediaTag = item.type.includes('video')
                ? `<video src="${item.url}" controls></video>`
                : `<img src="${item.url}" alt="record">`;

            card.innerHTML = `
                <div class="media-frame">${mediaTag}</div>
                <div class="card-footer">
                    <span class="profile-badge">${item.targetName}</span>
                </div>
            `;
            feed.appendChild(card);
        });
    }

    window.filterBy = (name, btn) => {
        document.querySelectorAll('.target-pill').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');

        if(name === 'all') {
            renderCards(masterRecords);
        } else {
            const filtered = masterRecords.filter(r => r.targetName.toLowerCase() === name.toLowerCase());
            renderCards(filtered);
        }
    };
</script>
</body>
</html>
